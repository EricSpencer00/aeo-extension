<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 680px;
      min-height: 600px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f8;
      color: #1a1a2e;
    }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: white;
      padding: 18px 20px 14px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    .header h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-subtitle {
      font-size: 11px;
      opacity: 0.75;
      margin-top: 1px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .header-btn {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.12);
      color: white;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .header-btn:hover {
      background: rgba(255,255,255,0.22);
    }

    .header-btn.danger:hover {
      background: rgba(239, 68, 68, 0.5);
      border-color: rgba(239, 68, 68, 0.6);
    }

    /* STATS BAR */
    .stats-bar {
      display: flex;
      gap: 0;
      background: rgba(255,255,255,0.12);
      border-radius: 8px;
      overflow: hidden;
    }

    .stat-item {
      flex: 1;
      padding: 7px 10px;
      text-align: center;
      border-right: 1px solid rgba(255,255,255,0.15);
    }

    .stat-item:last-child {
      border-right: none;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
    }

    .stat-label {
      font-size: 9px;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* SEARCH + FILTERS */
    .toolbar {
      padding: 10px 14px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 7px;
      padding: 7px 10px;
      transition: border-color 0.15s;
    }

    .search-box:focus-within {
      border-color: #4f46e5;
      background: white;
    }

    .search-icon {
      font-size: 13px;
      opacity: 0.4;
    }

    .search-input {
      border: none;
      background: transparent;
      font-size: 12px;
      width: 100%;
      outline: none;
      color: #1a1a2e;
    }

    .search-input::placeholder {
      color: #9ca3af;
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 11px;
      color: #9ca3af;
      flex-shrink: 0;
    }

    .filter-tag {
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      font-weight: 500;
    }

    /* CONTENT */
    .content {
      max-height: 560px;
      overflow-y: auto;
      padding: 12px 14px;
    }

    .content::-webkit-scrollbar {
      width: 5px;
    }

    .content::-webkit-scrollbar-track {
      background: transparent;
    }

    .content::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 10px;
    }

    /* DATE GROUP */
    .date-group-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #9ca3af;
      padding: 10px 0 6px;
    }

    .date-group-label:first-child {
      padding-top: 2px;
    }

    /* QUERY CARD */
    .query-item {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 11px 13px;
      margin-bottom: 8px;
      transition: box-shadow 0.15s, border-color 0.15s;
    }

    .query-item:hover {
      border-color: #c4b5fd;
      box-shadow: 0 2px 10px rgba(79, 70, 229, 0.08);
    }

    .query-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 7px;
    }

    .query-source {
      display: inline-block;
      color: white;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .web-badge {
      font-size: 10px;
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
      border-radius: 4px;
      padding: 2px 6px;
      font-weight: 600;
    }

    .query-text {
      font-size: 13px;
      color: #111827;
      line-height: 1.5;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .query-text mark {
      background: #fef08a;
      border-radius: 2px;
      padding: 0 1px;
    }

    .query-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .query-time {
      font-size: 10px;
      color: #9ca3af;
    }

    .copy-btn {
      padding: 3px 9px;
      font-size: 11px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      cursor: pointer;
      color: #6b7280;
      transition: all 0.15s;
    }

    .copy-btn:hover {
      background: #e5e7eb;
      color: #111827;
    }

    .copy-btn.copied {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #16a34a;
    }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 60px 30px;
      color: #9ca3af;
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 14px;
      opacity: 0.5;
    }

    .empty-state h3 {
      font-size: 15px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .empty-state p {
      font-size: 12px;
      line-height: 1.6;
    }

    /* TOAST */
    #toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1a1a2e;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <div class="header-brand">
        <div class="live-dot"></div>
        <div>
          <div class="header h1" style="font-size:17px;font-weight:700;">AEO Queries</div>
          <div class="header-subtitle">See what AI is actually searching for</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="header-btn" id="exportBtn">Export CSV</button>
        <button class="header-btn danger" id="clearBtn">Clear All</button>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-value" id="totalCount">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="webSearchCount">0</div>
        <div class="stat-label">Web Searches</div>
      </div>
      <div class="stat-item" id="topSourceStat">
        <div class="stat-value" id="topSourceName">—</div>
        <div class="stat-label">Top Source</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="todayCount">0</div>
        <div class="stat-label">Today</div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">🔎</span>
      <input type="text" class="search-input" id="searchInput" placeholder="Search captured queries…">
    </div>
    <div class="filter-row">
      <span class="filter-label">Filter:</span>
      <div id="filterContainer" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
    </div>
  </div>

  <div class="content" id="content">
    <div class="empty-state">
      <div class="empty-icon">🤖</div>
      <h3>No queries captured yet</h3>
      <p>Open ChatGPT, Claude, Perplexity, or Gemini<br>and ask a question to start capturing queries.</p>
    </div>
  </div>

  <div id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
