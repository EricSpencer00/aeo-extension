<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px;
      border-bottom: 1px solid #e0e0e0;
    }

    .header h1 {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .controls {
      padding: 12px 16px;
      background: white;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    button:hover {
      background: #f0f0f0;
      border-color: #999;
    }

    button.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .content {
      max-height: 600px;
      overflow-y: auto;
      padding: 16px;
      background: white;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .empty-state p {
      margin-bottom: 8px;
    }

    .query-item {
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    .query-item:hover {
      border-color: #667eea;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
    }

    .query-source {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .query-text {
      font-size: 14px;
      color: #333;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .query-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #999;
    }

    .query-time {
      font-size: 11px;
      color: #999;
    }

    .copy-btn {
      padding: 4px 8px;
      font-size: 11px;
      background: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 3px;
      cursor: pointer;
    }

    .copy-btn:hover {
      background: #e0e0e0;
    }

    .filter-tag {
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid #ddd;
      background: white;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-tag.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .stats {
      padding: 12px 16px;
      background: white;
      border-top: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>AEO Queries</h1>
    <p>See what AI is searching for</p>
  </div>

  <div class="controls">
    <button id="clearBtn">Clear All</button>
    <button id="exportBtn">Export CSV</button>
    <button id="settingsBtn">Settings</button>
  </div>

  <div class="stats">
    <div>Total queries: <strong id="totalCount">0</strong></div>
    <div id="sourceBreakdown"></div>
  </div>

  <div class="filters" style="padding: 12px 16px; background: white; border-bottom: 1px solid #e0e0e0;">
    <span style="font-size: 12px; color: #666; margin-right: 8px;">Filter:</span>
    <div class="filters" id="filterContainer" style="margin: 0;"></div>
  </div>

  <div class="content" id="content">
    <div class="empty-state">
      <p>No queries captured yet</p>
      <p style="font-size: 11px;">Open an AI chat interface (ChatGPT, Claude, Perplexity, etc.) and ask a question to see queries.</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
