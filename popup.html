<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AEO Queries</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c2430;
    --line: #262d38;
    --text: #e6edf3;
    --muted: #8b97a8;
    --accent: #4ea3ff;
    --good: #3fb950;
    --warn: #d9a441;
    --chatgpt: #10a37f;
    --claude: #d97757;
    --perplexity: #20a5b8;
    --gemini: #8a7dff;
    --copilot: #59a6ff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff; --panel: #f6f8fa; --panel-2: #eef1f5; --line: #d8dee4;
      --text: #1f2328; --muted: #636c76;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  .title { display: flex; align-items: baseline; gap: 8px; }
  .title h1 { font-size: 14px; margin: 0; letter-spacing: -0.01em; }
  .title .count { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }

  .tabs { display: flex; gap: 2px; margin-top: 10px; }
  .tab {
    flex: 1; padding: 6px 8px; border: 0; border-radius: 6px;
    background: transparent; color: var(--muted); font: inherit; font-size: 12px;
    cursor: pointer;
  }
  .tab:hover { background: var(--panel-2); color: var(--text); }
  .tab[aria-selected="true"] { background: var(--panel-2); color: var(--text); font-weight: 600; }

  .controls { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  input[type="search"] {
    flex: 1; min-width: 0; padding: 6px 9px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit;
  }
  input[type="search"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  select {
    padding: 6px 6px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; font-size: 12px;
  }

  main { flex: 1; overflow-y: auto; padding: 10px 12px 60px; }

  .turn {
    border: 1px solid var(--line); border-radius: 9px;
    background: var(--panel); margin-bottom: 10px; overflow: hidden;
  }
  .turn-head { padding: 9px 11px; border-bottom: 1px solid var(--line); }
  .turn-meta { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .badge {
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 4px; color: #04121a;
  }
  .badge.ChatGPT { background: var(--chatgpt); }
  .badge.Claude { background: var(--claude); }
  .badge.Perplexity { background: var(--perplexity); }
  .badge.GoogleGemini { background: var(--gemini); }
  .badge.MicrosoftCopilot { background: var(--copilot); }
  .badge.Unknown { background: var(--muted); }
  .time { color: var(--muted); font-size: 11px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .prompt { font-size: 12.5px; color: var(--text); overflow-wrap: anywhere; }
  .prompt.none { color: var(--muted); font-style: italic; }

  .queries { list-style: none; margin: 0; padding: 0; }
  .q {
    display: flex; gap: 8px; align-items: flex-start;
    padding: 7px 11px; border-top: 1px solid var(--line);
  }
  .q:first-child { border-top: 0; }
  .q:hover { background: var(--panel-2); }
  .q-text {
    flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; overflow-wrap: anywhere;
  }
  .q mark { background: rgba(78,163,255,.28); color: inherit; border-radius: 2px; }
  .copy {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 5px; font: inherit; font-size: 11px; padding: 2px 6px; cursor: pointer;
    opacity: 0; transition: opacity .1s;
  }
  .q:hover .copy, .copy:focus { opacity: 1; }
  .copy:hover { color: var(--text); border-color: var(--accent); }
  .no-queries { padding: 8px 11px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }

  /* aggregate view */
  .rank { list-style: none; margin: 0; padding: 0; }
  .rank li {
    display: flex; gap: 9px; align-items: center;
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--panel); margin-bottom: 6px;
  }
  .rank .n {
    min-width: 24px; text-align: center; font-variant-numeric: tabular-nums;
    font-weight: 700; color: var(--accent); font-size: 12px;
  }
  .rank .t { flex: 1; font-family: ui-monospace, Menlo, monospace; font-size: 12px; overflow-wrap: anywhere; }
  .bar { height: 3px; background: var(--accent); border-radius: 2px; margin-top: 4px; }

  .empty { text-align: center; padding: 44px 22px; color: var(--muted); }
  .empty h2 { color: var(--text); font-size: 14px; margin: 0 0 8px; }
  .empty p { margin: 0 0 14px; font-size: 12.5px; }
  .empty ol { text-align: left; display: inline-block; margin: 0; padding-left: 18px; font-size: 12.5px; }
  .empty li { margin-bottom: 5px; }

  footer {
    position: sticky; bottom: 0; display: flex; gap: 6px; padding: 8px 12px;
    border-top: 1px solid var(--line); background: var(--panel);
  }
  button.action {
    flex: 1; padding: 7px 6px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font: inherit; font-size: 12px; cursor: pointer;
  }
  button.action:hover { border-color: var(--accent); }
  button.action.danger:hover { border-color: #f85149; color: #f85149; }

  .diag { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; background: var(--panel); }
  .diag .u { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
  .diag .k { font-size: 11px; color: var(--muted); margin-top: 5px; overflow-wrap: anywhere; }
  .note { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .hidden { display: none !important; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 56px;
    background: var(--accent); color: #04121a; font-size: 12px; font-weight: 600;
    padding: 5px 11px; border-radius: 20px; opacity: 0; transition: opacity .15s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>AEO Queries</h1>
    <span class="count" id="count">0 queries</span>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" id="tab-timeline" role="tab" aria-selected="true">Timeline</button>
    <button class="tab" id="tab-top" role="tab" aria-selected="false">Top queries</button>
    <button class="tab" id="tab-diag" role="tab" aria-selected="false">Status</button>
  </div>
  <div class="controls" id="controls">
    <input type="search" id="filter" placeholder="Filter queries and prompts…" autocomplete="off">
    <select id="source">
      <option value="">All sources</option>
      <option value="ChatGPT">ChatGPT</option>
      <option value="Claude">Claude</option>
      <option value="Perplexity">Perplexity</option>
      <option value="Google Gemini">Gemini</option>
      <option value="Microsoft Copilot">Copilot</option>
    </select>
  </div>
</header>

<main id="view"></main>

<footer>
  <button class="action" id="copy-all">Copy queries</button>
  <button class="action" id="export-csv">Export CSV</button>
  <button class="action danger" id="clear">Clear</button>
</footer>

<div class="toast" id="toast"></div>
<script src="popup.js"></script>
</body>
</html>
