<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { height: 100%; }

    body {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f7f8fc;
      color: #111;
      font-size: 13px;
    }

    /* ── HEADER ─────────────────────────────────────────────────── */
    .header {
      background: #18181b;
      color: #fff;
      padding: 14px 16px 12px;
      flex-shrink: 0;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 7px; height: 7px;
      background: #4ade80;
      border-radius: 50%;
      animation: breathe 2.4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.5; transform:scale(.8); }
    }

    .brand-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -.3px;
    }

    .brand-sub {
      font-size: 10px;
      color: #71717a;
      margin-top: 1px;
    }

    .header-btns {
      display: flex;
      gap: 6px;
    }

    .hbtn {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #3f3f46;
      background: transparent;
      color: #a1a1aa;
      font-size: 11px;
      cursor: pointer;
      transition: all .15s;
    }
    .hbtn:hover { background: #27272a; color: #fff; border-color: #52525b; }
    .hbtn.danger:hover { background: #450a0a; color: #fca5a5; border-color: #7f1d1d; }

    /* ── STATS ──────────────────────────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .stat {
      background: #27272a;
      border-radius: 7px;
      padding: 7px 8px;
      text-align: center;
    }

    .stat-val {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }

    .stat-lbl {
      font-size: 9px;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-top: 3px;
    }

    /* ── TOOLBAR ────────────────────────────────────────────────── */
    .toolbar {
      padding: 10px 12px;
      background: #fff;
      border-bottom: 1px solid #e4e4e7;
      flex-shrink: 0;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #f4f4f5;
      border: 1.5px solid transparent;
      border-radius: 8px;
      padding: 7px 10px;
      margin-bottom: 8px;
      transition: border-color .15s, background .15s;
    }
    .search-wrap:focus-within { background: #fff; border-color: #6366f1; }

    .search-wrap svg { flex-shrink: 0; opacity: .35; }

    .search-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 12px;
      color: #111;
      outline: none;
    }
    .search-input::placeholder { color: #a1a1aa; }

    .filters {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .filter-lbl { font-size: 10px; color: #a1a1aa; }

    .chip {
      padding: 3px 9px;
      border-radius: 20px;
      border: 1.5px solid;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }

    /* ── FEED ───────────────────────────────────────────────────── */
    .feed {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 16px;
    }

    .feed::-webkit-scrollbar { width: 4px; }
    .feed::-webkit-scrollbar-thumb { background: #e4e4e7; border-radius: 4px; }

    /* date label */
    .day-label {
      font-size: 10px;
      font-weight: 700;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: .8px;
      padding: 10px 0 6px;
    }
    .day-label:first-child { padding-top: 2px; }

    /* ── CARD ───────────────────────────────────────────────────── */
    .card {
      background: #fff;
      border: 1.5px solid #e4e4e7;
      border-radius: 10px;
      padding: 11px 13px;
      margin-bottom: 8px;
      transition: border-color .15s, box-shadow .15s;
    }
    .card:hover { border-color: #a5b4fc; box-shadow: 0 2px 12px rgba(99,102,241,.08); }

    /* web-search card gets accent left border */
    .card.is-web {
      border-left: 3px solid #6366f1;
      padding-left: 11px;
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 7px;
      flex-wrap: wrap;
    }

    .source-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #fff;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .3px;
      text-transform: uppercase;
    }

    .web-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 700;
      background: #eef2ff;
      color: #4f46e5;
      border: 1.5px solid #c7d2fe;
      border-radius: 5px;
      padding: 2px 7px;
    }

    /* The AI's actual search query */
    .card-query {
      font-size: 13px;
      font-weight: 600;
      color: #18181b;
      line-height: 1.45;
      margin-bottom: 6px;
      word-break: break-word;
    }
    .card-query mark {
      background: #fef9c3;
      border-radius: 2px;
      padding: 0 1px;
      font-weight: inherit;
    }

    /* User's original question (context) */
    .card-context {
      display: flex;
      align-items: flex-start;
      gap: 5px;
      margin-bottom: 7px;
      padding: 5px 8px;
      background: #fafafa;
      border-radius: 6px;
      border: 1px solid #f0f0f0;
    }

    .context-arrow {
      font-size: 10px;
      color: #a1a1aa;
      margin-top: 1px;
      flex-shrink: 0;
    }

    .context-text {
      font-size: 11px;
      color: #71717a;
      line-height: 1.4;
      word-break: break-word;
    }

    .context-label {
      font-size: 10px;
      font-weight: 600;
      color: #a1a1aa;
      flex-shrink: 0;
      margin-right: 2px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-time { font-size: 10px; color: #a1a1aa; }

    .copy-btn {
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 500;
      background: #f4f4f5;
      border: 1px solid #e4e4e7;
      border-radius: 5px;
      cursor: pointer;
      color: #52525b;
      transition: all .15s;
    }
    .copy-btn:hover { background: #e4e4e7; color: #18181b; }
    .copy-btn.copied { background: #f0fdf4; border-color: #bbf7d0; color: #16a34a; }

    /* ── EMPTY ──────────────────────────────────────────────────── */
    .empty {
      text-align: center;
      padding: 56px 24px;
      color: #a1a1aa;
    }
    .empty-icon { font-size: 38px; margin-bottom: 12px; opacity: .5; }
    .empty h3 { font-size: 14px; color: #52525b; margin-bottom: 6px; font-weight: 600; }
    .empty p { font-size: 12px; line-height: 1.6; }

    /* ── TOAST ──────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 14px; left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: #18181b;
      color: #fff;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 99;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-row">
      <div class="brand">
        <div class="brand-dot"></div>
        <div>
          <div class="brand-name">AEO Queries</div>
          <div class="brand-sub">See what AI actually searches for</div>
        </div>
      </div>
      <div class="header-btns">
        <button class="hbtn" id="exportBtn">Export CSV</button>
        <button class="hbtn danger" id="clearBtn">Clear</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-val" id="statTotal">0</div><div class="stat-lbl">Total</div></div>
      <div class="stat"><div class="stat-val" id="statWeb">0</div><div class="stat-lbl">Web searches</div></div>
      <div class="stat"><div class="stat-val" id="statTop">—</div><div class="stat-lbl">Top source</div></div>
      <div class="stat"><div class="stat-val" id="statToday">0</div><div class="stat-lbl">Today</div></div>
    </div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="13" height="13" viewBox="0 0 20 20" fill="none">
        <circle cx="9" cy="9" r="7" stroke="#000" stroke-width="2"/>
        <path d="M14.5 14.5L19 19" stroke="#000" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input class="search-input" id="searchInput" placeholder="Search queries…" autocomplete="off">
    </div>
    <div class="filters">
      <span class="filter-lbl">Filter:</span>
      <div id="filterContainer" style="display:flex;gap:5px;flex-wrap:wrap;"></div>
    </div>
  </div>

  <!-- FEED -->
  <div class="feed" id="feed">
    <div class="empty">
      <div class="empty-icon">🤖</div>
      <h3>No queries yet</h3>
      <p>Open ChatGPT, Claude, Perplexity, or Gemini<br>and ask something to start capturing.</p>
    </div>
  </div>

  <div id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
