<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      color: #333;
    }

    h1 {
      color: #667eea;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .setting {
      margin: 20px 0;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input[type="number"],
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    small {
      display: block;
      color: #999;
      margin-top: 4px;
    }

    button {
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 20px;
    }

    button:hover {
      background: #764ba2;
    }

    .success {
      color: #10a981;
      margin-top: 10px;
      display: none;
    }

    .source-list {
      list-style: none;
      padding: 0;
    }

    .source-list li {
      padding: 8px;
      background: white;
      margin: 8px 0;
      border-radius: 4px;
      border: 1px solid #e0e0e0;
    }

    .source-list input[type="checkbox"] {
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <h1>AEO Queries Settings</h1>

  <div class="setting">
    <label for="maxQueries">Maximum Queries to Store:</label>
    <input type="number" id="maxQueries" min="50" max="1000" value="500">
    <small>How many recent queries to keep (older ones will be deleted)</small>
  </div>

  <div class="setting">
    <label>Monitor These AI Interfaces:</label>
    <ul class="source-list">
      <li><label><input type="checkbox" class="source" value="ChatGPT" checked> ChatGPT</label></li>
      <li><label><input type="checkbox" class="source" value="Claude" checked> Claude</label></li>
      <li><label><input type="checkbox" class="source" value="Perplexity" checked> Perplexity</label></li>
      <li><label><input type="checkbox" class="source" value="Google Gemini" checked> Google Gemini</label></li>
      <li><label><input type="checkbox" class="source" value="Microsoft Copilot" checked> Microsoft Copilot</label></li>
    </ul>
  </div>

  <div class="setting">
    <label for="autoExport">Auto-Export Data:</label>
    <select id="autoExport">
      <option value="never">Never</option>
      <option value="daily">Daily</option>
      <option value="weekly">Weekly</option>
    </select>
    <small>Automatically export captured queries (downloads to your computer)</small>
  </div>

  <button id="save">Save Settings</button>
  <div class="success" id="success">✓ Settings saved!</div>

  <script src="options.js"></script>
</body>
</html>
